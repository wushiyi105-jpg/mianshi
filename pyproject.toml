[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mianshi"
version = "0.1.0"
description = "简历与 JD 匹配、面试提问、回答点评、措辞优化"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
mianshi = "mianshi.cli:main"

[tool.setuptools]
packages = ["mianshi"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
